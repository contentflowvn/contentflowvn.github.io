<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ContentFlow Studio helps creators automate short-form video content production and publishing workflows.">
  <title>ContentFlow Studio | Short-form Content Automation</title>

  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{

      font-family:Inter,Arial,Helvetica,sans-serif;
      background:#080b14;
      color:#f5f7ff;
      line-height:1.65;
    }
    a{text-decoration:none;color:inherit}
    .container{width:min(1120px,calc(100% - 40px));margin:auto}

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(8,11,20,.88);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .nav{
      min-height:74px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:30px;
    }
    .brand{

      align-items:center;
      gap:12px;
      font-weight:800;
      font-size:20px;
    }
    .brand-mark{
      width:38px;
      height:38px;
      border-radius:11px;
      display:grid;
      place-items:center;
      font-size:13px;
      font-weight:900;
      background:linear-gradient(135deg,#25d8ff,#805cff 55%,#d851ff);
      box-shadow:0 0 28px rgba(91,100,255,.35);
    }
    .nav-links{display:flex;gap:26px;color:#bec5d9;font-size:14px}
    .nav-links a:hover{color:#fff}

      overflow:hidden;

      text-align:center;
    }

      left:50%;

      pointer-events:none;
    }
